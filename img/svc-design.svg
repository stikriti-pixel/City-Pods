<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" font-family="'Courier New', ui-monospace, monospace">
  <defs>
    <pattern id="g" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#262623" stroke-width="0.6"/>
    </pattern>
    <pattern id="g5" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M100 0H0V100" fill="none" stroke="#34342f" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="#0d0d0c"/>
  <rect width="800" height="600" fill="url(#g)"/>
  <rect width="800" height="600" fill="url(#g5)"/>

  <!-- kitchen highlight -->
  <rect x="470" y="174" width="140" height="182" fill="#d6c531" fill-opacity="0.22"/>

  <!-- exterior walls -->
  <g fill="none" stroke="#f2f1ec" stroke-width="8" stroke-linejoin="miter">
    <path d="M120 170H680V360H120Z"/>
  </g>
  <!-- front windows (cut) -->
  <rect x="114" y="200" width="12" height="54" fill="#0d0d0c"/>
  <rect x="114" y="284" width="12" height="54" fill="#0d0d0c"/>
  <g stroke="#f2f1ec" stroke-width="1.5">
    <path d="M116 200V254M124 200V254M116 284V338M124 284V338"/>
  </g>
  <!-- front door opening on side? rear windows -->
  <rect x="674" y="290" width="12" height="44" fill="#0d0d0c"/>
  <path d="M676 290V334M684 290V334" stroke="#f2f1ec" stroke-width="1.5"/>
  <!-- rear window over sink -->
  <rect x="520" y="164" width="60" height="12" fill="#0d0d0c"/>
  <path d="M520 166H580M520 174H580" stroke="#f2f1ec" stroke-width="1.5"/>

  <!-- interior partitions -->
  <g stroke="#f2f1ec" stroke-width="5" fill="none">
    <path d="M300 170V232"/>
    <path d="M300 232H420"/>
    <path d="M610 170V250"/>
    <path d="M610 250H640"/>
    <path d="M664 250H680"/>
  </g>
  <!-- stair -->
  <g stroke="#f2f1ec" stroke-width="1.2" fill="none">
    <path d="M304 174H420V228H304"/>
    <path d="M318 174V228M332 174V228M346 174V228M360 174V228M374 174V228M388 174V228M402 174V228"/>
    <path d="M310 201H412" stroke-dasharray="4 3"/>
    <path d="M404 195L412 201L404 207"/>
  </g>
  <!-- door swings -->
  <g stroke="#f2f1ec" stroke-width="1.2" fill="none">
    <path d="M640 250V226"/>
    <path d="M640 226A24 24 0 0 1 664 250" stroke-dasharray="3 3"/>
  </g>
  <!-- kitchen counters + island -->
  <g stroke="#f2f1ec" stroke-width="1.5" fill="none">
    <path d="M474 174H606V198H474"/>
    <path d="M582 198V352H606"/>
    <rect x="500" y="250" width="56" height="34"/>
    <rect x="532" y="178" width="30" height="16" rx="3"/>
  </g>
  <!-- dining table -->
  <g stroke="#f2f1ec" stroke-width="1.2" fill="none">
    <rect x="356" y="268" width="70" height="44" rx="4"/>
    <circle cx="374" cy="260" r="6"/><circle cx="408" cy="260" r="6"/>
    <circle cx="374" cy="320" r="6"/><circle cx="408" cy="320" r="6"/>
  </g>

  <!-- room labels -->
  <g fill="#f2f1ec" font-size="13" letter-spacing="1.5" text-anchor="middle">
    <text x="210" y="270">LIVING</text>
    <text x="210" y="286" font-size="10" fill="#a7a59c">15'-4" × 15'-0"</text>
    <text x="392" y="352" font-size="12">DINING</text>
    <text x="528" y="320">KITCHEN</text>
    <text x="645" y="210" font-size="10">PWDR</text>
  </g>

  <!-- dimension strings -->
  <g stroke="#a7a59c" stroke-width="1" fill="none">
    <path d="M120 130H680"/>
    <path d="M120 122V140M300 124V136M470 124V136M610 124V136M680 122V140"/>
    <path d="M90 170V360"/>
    <path d="M82 170H98M82 360H98"/>
  </g>
  <g fill="#a7a59c" font-size="11" text-anchor="middle">
    <text x="210" y="124">15'-0"</text>
    <text x="385" y="124">14'-2"</text>
    <text x="540" y="124">11'-8"</text>
    <text x="645" y="124">5'-10"</text>
    <text x="400" y="104" fill="#f2f1ec" font-size="12" letter-spacing="1">48'-0"</text>
    <text x="70" y="269" transform="rotate(-90 70 269)">16'-0"</text>
  </g>

  <!-- north arrow -->
  <g transform="translate(730 120)" fill="none" stroke="#f2f1ec" stroke-width="1.5">
    <circle r="16"/>
    <path d="M0 -12L6 8L0 3L-6 8Z" fill="#d6c531" stroke="none"/>
    <text y="-22" fill="#f2f1ec" stroke="none" font-size="11" text-anchor="middle">N</text>
  </g>

  <!-- section cut marker -->
  <g stroke="#d6c531" stroke-width="2" fill="none">
    <path d="M440 150V380" stroke-dasharray="10 5"/>
  </g>
  <g fill="#d6c531" font-size="12" text-anchor="middle">
    <circle cx="440" cy="392" r="12" fill="none" stroke="#d6c531" stroke-width="1.5"/>
    <text x="440" y="396">A</text>
  </g>

  <!-- title block -->
  <g>
    <rect x="460" y="440" width="300" height="120" fill="#0d0d0c" stroke="#f2f1ec" stroke-width="1.5"/>
    <path d="M460 480H760M460 520H760M640 520V560" stroke="#f2f1ec" stroke-width="1"/>
    <text x="476" y="466" fill="#f2f1ec" font-size="15" letter-spacing="2">FIRST FLOOR PLAN</text>
    <text x="476" y="505" fill="#a7a59c" font-size="11" letter-spacing="1">ROWHOME RENOVATION</text>
    <text x="476" y="545" fill="#a7a59c" font-size="11">SCALE 1/4" = 1'-0"</text>
    <text x="656" y="545" fill="#d6c531" font-size="12" letter-spacing="1">A-101</text>
  </g>
  <text x="40" y="560" fill="#a7a59c" font-size="10" letter-spacing="1.5">ILLUSTRATIVE · NOT FOR CONSTRUCTION</text>
</svg>
